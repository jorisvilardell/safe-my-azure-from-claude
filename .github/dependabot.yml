version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      azure: { patterns: ['@azure/*'] }
      dev: { dependency-type: development }
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only. Lift this once it supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types must match the lowest supported runtime (engines: node >=24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /cli
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # Generated by `dist generate`: bump cargo-dist-version in dist-workspace.toml instead.
    exclude-paths: ['.github/workflows/release.yml']
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  # Compose images: the Dev Proxy image of the mock stack (docker-compose.mock.yml). The $schema
  # URLs in mocks/devproxy must follow it; test/mocks/devproxy-schemas.test.ts fails the PR until
  # they do: sed -i 's|schemas/vOLD/|schemas/vNEW/|' mocks/devproxy/*.json mocks/devproxy/*/*.json
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
