name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Upload coverage
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  leak-guard:
    name: No real Azure identifiers committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject non-fake GUIDs and JWTs
        run: |
          # Fake GUIDs must start with 00000000- or be the documented test GUID (AGENTS.md R7).
          hits=$(git grep -nIE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' -- . ':!package-lock.json' \
            | grep -vE '00000000-0000-0000-0000-[0-9a-fA-F]{12}|11111111-2222-3333-4444-555555555555' || true)
          if [ -n "$hits" ]; then echo "::error::Possible real Azure identifier committed:"; echo "$hits"; exit 1; fi

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: safe-my-azure-from-claude:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 127.0.0.1:8765:8765 safe-my-azure-from-claude:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8765/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8765/healthz
          docker rm -f smoke
