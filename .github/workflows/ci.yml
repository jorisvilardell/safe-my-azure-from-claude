name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Upload coverage
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  cli:
    name: CLI (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  leak-guard:
    name: No real Azure identifiers committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject non-fake GUIDs and JWTs
        run: |
          # Fake GUIDs must start with 00000000- or be the documented test GUID (AGENTS.md R7).
          hits=$(git grep -nIE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' -- . ':!package-lock.json' \
            | grep -vE '00000000-0000-0000-0000-[0-9a-fA-F]{12}|11111111-2222-3333-4444-555555555555' || true)
          if [ -n "$hits" ]; then echo "::error::Possible real Azure identifier committed:"; echo "$hits"; exit 1; fi

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: safe-my-azure-from-claude:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 127.0.0.1:8765:8765 safe-my-azure-from-claude:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8765/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8765/healthz
          docker rm -f smoke

  # The real container, end to end, against Azure mocked by Dev Proxy (mocks/devproxy). No tenant.
  e2e-mock:
    name: E2E against mocked Azure (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 20
    # Chaos (random 5xx, 429, latency) is informative, not a merge gate: it is random by design.
    continue-on-error: ${{ matrix.mode == 'chaos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: mocks
            devproxy-config: devproxyrc.json
          - mode: chaos
            devproxy-config: devproxyrc.chaos.json
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.mock.yml
      DEVPROXY_CONFIG: ${{ matrix.devproxy-config }}
      E2E_MOCK_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: safe-my-azure-from-claude:local
          cache-from: type=gha
      - name: Start the server and Dev Proxy
        run: $COMPOSE up -d --no-build --wait --wait-timeout 180
      - name: Run the e2e-mock suite
        run: npm run test:e2e-mock
      - name: Dump logs on failure
        if: failure()
        # The server logs through its scrubber, and the proxy only ever saw the fake IDs of the mocks.
        run: |
          $COMPOSE ps -a
          $COMPOSE logs --no-color --timestamps devproxy | tail -n 400
          $COMPOSE logs --no-color --timestamps azure-safe-mcp | tail -n 200
      - name: Stop
        if: always()
        run: $COMPOSE down -v
