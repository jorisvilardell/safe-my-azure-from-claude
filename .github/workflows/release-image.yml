# The server image for a release. Called by release.yml (dist `plan-jobs`) on a vX.Y.Z tag, before
# any binary is built and long before the GitHub Release exists, so the CLI's image_ref()
# (ghcr.io/jorisvilardell/safe-my-azure-from-claude:CARGO_PKG_VERSION) always points at an image
# that exists. release-dry-run.yml calls it with push: false.
name: Release image

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan (JSON). Unused; part of the dist custom job contract.
        required: false
        type: string
      push:
        description: Push to GHCR (tags only). false builds both platforms and discards the result.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jorisvilardell/safe-my-azure-from-claude
  PUSH: ${{ inputs.push && github.ref_type == 'tag' }}

jobs:
  image:
    name: Docker image (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Runs in parallel with release-version-check, so it guards its own push.
      - name: Tag matches package.json and cli/Cargo.toml
        if: env.PUSH == 'true'
        run: node scripts/bump-version.mjs --check "${{ github.ref_name }}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # X.Y.Z is what the CLI pulls. latest only for final releases, never for X.Y.Z-rc.N.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=safe-my-azure-from-claude
            org.opencontainers.image.description=Read-only, anonymising Azure MCP server
            org.opencontainers.image.licenses=MIT
      - name: Build (and push on a release tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
