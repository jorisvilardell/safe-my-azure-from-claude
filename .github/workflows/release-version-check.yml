# Tag format, at release time. Called by release.yml (dist `plan-jobs`) on a tag: nothing is built
# unless the tag is vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N. The tag is the release version: every job
# that builds writes it into the version files first (scripts/patch-release-workflow.mjs), so the
# files on the tagged commit don't have to match (an rc and its final release share one commit).
name: Release version check

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan (JSON). Unused; part of the dist custom job contract.
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Release tag format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.ref_type }}" != tag ] || ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'; then
            echo "::error::Releases are cut from tags like v1.2.3 or v1.2.3-rc.1 (alpha, beta, rc), got '$TAG'."
            exit 1
          fi
          # The script accepts it too (it writes it into the version files in the build jobs).
          node scripts/bump-version.mjs "$TAG" >/dev/null
