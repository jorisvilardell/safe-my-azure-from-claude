# Version lock (ADR 0001 §7), at release time. Called by release.yml (dist `plan-jobs`) on a tag:
# no binary is built unless the tag is exactly v<package.json version> = v<cli/Cargo.toml version>.
name: Release version check

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan (JSON). Unused; part of the dist custom job contract.
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Tag matches package.json and cli/Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.ref_type }}" != tag ] || ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Releases are cut from tags like v1.2.3, got '$TAG'."
            exit 1
          fi
          node scripts/bump-version.mjs --check "$TAG"
