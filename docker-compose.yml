services:
  azure-safe-mcp:
    build: .
    image: safe-my-azure-from-claude:local
    container_name: azure-safe-mcp
    restart: unless-stopped
    ports:
      # Loopback only — never expose on the LAN. The safe-azure CLI and the MCP client config
      # expect 127.0.0.1:8765: change the host port only if you also point them elsewhere.
      - '127.0.0.1:8765:8765'
    volumes:
      # Read-only tenant/subscription alias map. No credentials in it.
      - ./config/contexts.yaml:/app/config/contexts.yaml:ro
      # Optional audit file (AUDIT_LOG=file, AUDIT_LOG_FILE=/app/audit/audit.jsonl). Lines are
      # scrubbed like the logs; append-only, no rotation. The host folder must be writable by
      # the container user (uid 1000).
      # - ./audit:/app/audit
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INVENTORY_MAX_RESOURCES: ${INVENTORY_MAX_RESOURCES:-50000}
      INVENTORY_RESOURCE: ${INVENTORY_RESOURCE:-off}
      # Audit trail of tool calls: stderr (default) | file | off.
      AUDIT_LOG: ${AUDIT_LOG:-stderr}
      AUDIT_LOG_FILE: ${AUDIT_LOG_FILE:-}
      # No PUBLIC_URL (#53): since ADR 0001 the server serves no login page, so no link depends on
      # the published port. The sign-in link is Microsoft's device-code URL, from `safe-azure login`.
    # Hardening: tokens live in process memory only (AGENTS.md R8).
    read_only: true
    tmpfs:
      - /tmp
      # The keys file (/run/safe-azure/keys.json, 0600): memory only, gone on restart. The CLI
      # reads it with `docker exec azure-safe-mcp cat /run/safe-azure/keys.json` (ADR 0001 §1).
      - /run/safe-azure:uid=1000,gid=1000,mode=0700,noexec,nosuid,nodev,size=64k
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
